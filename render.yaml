services:
  - type: web
    name: sonora-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: sonora-db, property: connectionString } }
      - { key: CLIENT_ORIGIN, sync: false }
      - { key: CLERK_PUBLISHABLE_KEY, sync: false }
      - { key: CLERK_SECRET_KEY, sync: false }
      - { key: CLERK_WEBHOOK_SIGNING_SECRET, sync: false }
databases:
  - name: sonora-db
    plan: basic-256mb
